<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AnimeTracker - Restablecer contraseña</title>
    <link rel="stylesheet" href="indexc.css">
</head>
<body>
    <div class="screen active">
        <div class="container">
            <h1>AnimeTracker</h1>
            <h2>Restablecer contraseña</h2>
            <form id="reset-form">
                <input type="password" id="new-password" placeholder="Nueva contraseña" required minlength="4">
                <input type="password" id="confirm-password" placeholder="Confirmar contraseña" required minlength="4">
                <button type="submit">Guardar nueva contraseña</button>
            </form>
            <p id="reset-message" style="margin-top:15px; color:#ddaaee;"></p>
            <p><a href="index.html" style="color:#ff99dd;">Volver al inicio de sesión</a></p>
        </div>
    </div>

    <script>
        const API_BASE = '/api';
        const params = new URLSearchParams(window.location.search);
        const token = params.get('token');

        const form = document.getElementById('reset-form');
        const messageEl = document.getElementById('reset-message');

        if (!token) {
            messageEl.textContent = 'Este enlace no es válido. Solicita uno nuevo desde la pantalla de inicio de sesión.';
            form.style.display = 'none';
        }

        form.addEventListener('submit', async function (e) {
            e.preventDefault();

            const newPassword = document.getElementById('new-password').value;
            const confirmPassword = document.getElementById('confirm-password').value;

            if (newPassword !== confirmPassword) {
                messageEl.textContent = 'Las contraseñas no coinciden.';
                return;
            }

            try {
                const res = await fetch(`${API_BASE}/restablecer-contrasena`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token, password: newPassword })
                });
                const data = await res.json();

                if (!res.ok) {
                    messageEl.textContent = data.error || 'No se pudo restablecer la contraseña.';
                    return;
                }

                messageEl.textContent = '¡Contraseña actualizada! Ya puedes iniciar sesión.';
                form.style.display = 'none';
            } catch (err) {
                console.error(err);
                messageEl.textContent = 'No se pudo conectar con el servidor.';
            }
        });
    </script>
</body>
</html>
